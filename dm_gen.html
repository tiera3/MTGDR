body { font-family: Arial, sans-serif; margin: 20px 20px 20px 118px; background: #f5f5f5; }
h2 { margin-bottom: 15px; }
#alternative { font-size: 16px; padding: 7px; min-width: 300px; max-width: 100%; }
#sourcefile { font-size: 14px; height: 36px; max-width: 220px; }
#status { margin: 12px 0; color: #555; }
#status.error { color: #c00000; font-weight: bold; }
#buttons { margin: 8px 0 12px; display: flex; flex-wrap: wrap; gap: 8px; }
button { padding: 8px 16px; font-size: 14px; cursor: pointer; }
button:disabled { cursor: default; opacity: 0.5; }
#buttons button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }

.buttonIcon { display: inline-block; width: 20px; height: 20px; background-position: center; background-repeat: no-repeat; background-size: contain; }
.saveIcon { background-image: var(--saveIcon); }
.dmIcon { background-image: var(--dmIcon); }
.betaIcon { background-image: var(--betaIcon); }

#output { position: relative; left: -98px; width: calc(100% + 98px);
  box-sizing: border-box; background: white; border: 1px solid #ccc;
  padding: 12px; overflow: auto; white-space: pre; overflow-wrap: normal; max-height: 80vh; word-wrap: normal;
  line-height: 1.4; tab-size: 4; font-size: 13px; font-family: Consolas, "Courier New", monospace; }

/* =========================================
   CONTROL AREA
   ========================================= */

#controlArea { position: relative; margin-bottom: 5px; }
#mainControls { min-width: 0; }

/* =========================================
   GROUP SELECTOR
   ========================================= */

#groupMenu { position: absolute; left: -98px; top: 0; bottom: 0;
  display: flex; width: 90px; flex-direction: column; align-items: stretch;
  gap: 4px; min-height: 0; overflow-y: auto; }
.groupOption { width: 100%; box-sizing: border-box; flex: 0 0 auto;
  padding: 5px 7px; border: 1px solid #aaa; border-radius: 5px;
  background: #e8e8e8; color: #333; cursor: pointer;
  font-size: 14px; text-align: center; white-space: nowrap; overflow: hidden; }
.groupOption.selected { background: #444; color: white; border-color: #444; }
.groupOption:focus-visible { outline: 2px solid #1677d2; outline-offset: 2px; }
.categoryShort { display: none; }

/* =========================================
   SMALL SCREENS
   ========================================= */

@media (max-width: 600px) { body { margin-left: 73px; } #groupMenu { left: -53px; width: 45px; }
  #output { left: -53px; width: calc(100% + 53px); }
  .categoryFull { display: none; } .categoryShort { display: inline; } }

/* =========================================
   SOURCE MENU
   ========================================= */

#sourceMenu { display: flex; flex: 1 1 auto; min-width: 0; flex-wrap: nowrap; align-items: center; gap: 6px; overflow-x: auto; overflow-y: hidden; padding: 4px 5px; min-height: 30px; scroll-behavior: smooth; scrollbar-width: thin; }
.source-entry { position: relative; display: inline-flex; flex: 0 0 auto; width: max-content; align-items: center; justify-content: center; }

.sourceOption { outline: none; display: inline-flex; flex: 0 0 auto;
  width: max-content; min-width: max-content; box-sizing: border-box;
  align-items: center; justify-content: center; padding: 3px 5px; margin: 0;
  border: 2px solid transparent; border-radius: 5px; background: transparent; cursor: pointer; }

.sourceOption img { display: inline-block; flex: 0 0 auto; object-fit: contain; max-height: 30px; max-width: 100px; vertical-align: middle; }
.sourceOption.selected { border-color: green; }
.sourceOption.selected-error { border-color: red; }
.sourceOption:disabled { opacity: 0.30; filter: grayscale(100%); cursor: default; }

/* =========================================
   TOOLTIP
   ========================================= */

#sourceTooltip { position: fixed; display: none; width: 400px; max-width: calc(100vw - 20px);
    box-sizing: border-box; background: #555; color: white; text-align: center;
    border-radius: 6px; padding: 7px; z-index: 100000; font-size: 14px;
    pointer-events: none; white-space: normal; }

#sourceTooltip::before { content: ""; position: absolute; top: 100%;
    left: var(--pointer-position, 50%); transform: translateX(-50%);
    border-width: 5px; border-style: solid;
    border-color: #555 transparent transparent transparent; }

#sourceName { margin-top: 12px; font-size: 18px; font-weight: bold; min-height: 22px; }
.icon-content { display: inline-flex; flex: 0 0 auto; width: max-content; align-items: center; justify-content: center; white-space: nowrap; }
.icon-content img { display: inline-block; flex: 0 0 auto; object-fit: contain; max-height: 30px; max-width: 100px; vertical-align: middle; }

</style>

<body>

<h2>Collated Draftmancer File Generator</h2>

<div id="controlArea">
  <div id="groupMenu" tabindex="0"></div>
  <div id="mainControls">
    <div id="sourceMenu" tabIndex="-1"></div>
    <div id="sourceName"></div>

    <div id="alternativeSection"><label for="alternative">Select format: </label>
      <select id="alternative" tabindex="0" disabled><option>Select source file first...</option></select></div>
  
    <div id="status">Initialising...</div>

    <div id="buttons">
      <button id="saveButton" tabindex="0" onclick="saveGeneratedText()" disabled><span class="buttonIcon saveIcon"></span>Save File</button>
      <button id="draftButton" tabindex="0" onclick="sendToDraftmancer('release', false)" disabled><span class="buttonIcon dmIcon"></span>Draftmancer</button>
      <button id="betaButton" tabindex="0" onclick="sendToDraftmancer('beta', false)" disabled><span class="buttonIcon betaIcon"></span>Beta</button>
      <button id="testButton" tabindex="0" onclick="sendToDraftmancer('beta', true)" disabled style="display:none">Test Mode</button>
      <input id="sourcefile" tabindex="0" type="file" accept=".txt" style="display:none">
    </div>
  </div>
</div>

<pre id="output" tabindex="0"></pre>
<script>


// ==================================================
// GLOBAL VARIABLES
// ==================================================

let sourceLines = []; let alternatives = []; let sources = []; let selectedSource = null; let currentSource = null; let generatedText = ""; let generatedFilename = "";
let temporaryErrorSource = null; let currentMenuCategory = "main";
const sourceMenu = document.getElementById("sourceMenu");
Object.defineProperty(Element.prototype, "_hasClass", {
  value: function(name) { return this.classList.contains(name); } });

// ==================================================
// SOURCE CONFIGURATION
// ==================================================

const SOURCE_BASE = "https://raw.githubusercontent.com/tiera3/MTGDR/refs/heads/main/";

    async function getAvailableSourceFiles() {
const response = await fetch("https://api.github.com/repos/tiera3/MTGDR/contents?ref=main", { cache: "no-cache" });
if (!response.ok) throw new Error("Unable to check GitHub source directory: HTTP " + response.status);
const files = await response.json();
    return new Set(files.filter(file => file.type === "file").map(file => file.name));
    }
    async function loadSources() {
const response = await fetch(SOURCE_BASE + "dm_gen.json", { cache: "no-cache" });
if (!response.ok) throw new Error("Unable to load dm_gen.json: HTTP " + response.status);
sources = await response.json();
if (!Array.isArray(sources)) throw new Error("Invalid dm_gen.json format.");
    // Check availability of all menu entries.
(dir => { sources.forEach(source => { source.enabled = dir.has(source.id + ".dm.txt"); });
  })(await getAvailableSourceFiles());
    // Find all available menu categories.
const categories = [...new Set(sources.map(source => source.category))];
if (!categories.includes(currentMenuCategory)) currentMenuCategory = categories[0] || "main";
renderMenuCategories(); renderSourceMenu();
    }

// ==================================================
// TOOLTIP
// ==================================================

const sourceTooltip = document.createElement("div");
sourceTooltip.id = "sourceTooltip";
document.body.appendChild(sourceTooltip);

    function showSourceTooltip(button, name) {
sourceTooltip.textContent = name; sourceTooltip.style.whiteSpace = "pre-line"; sourceTooltip.style.display = "block";
const rect = button.getBoundingClientRect(); const tooltipWidth = sourceTooltip.offsetWidth;
    // Pointer target: 20% across the menu item.
const pointerTarget = rect.left + rect.width * 0.5;
    // Initially centre the tooltip on the pointer target.
let left = pointerTarget - tooltipWidth * 0.2;
    // Keep tooltip within the viewport.
left = Math.max(10, Math.min(left, window.innerWidth - tooltipWidth - 10));
    // Position tooltip above the menu item.
sourceTooltip.style.left = left + "px";
sourceTooltip.style.top = (rect.top - sourceTooltip.offsetHeight - 8) + "px";
    // Adjust pointer to continue pointing at the menu item.
const pointerPosition = pointerTarget - left;
sourceTooltip.style.setProperty("--pointer-position", pointerPosition + "px");
    }

function hideSourceTooltip() { sourceTooltip.style.display = "none"; }

// ==================================================
// RENDER MENU CATEGORIES
// ==================================================

function categoryLabel(category) { const firstCharacter = category.charAt(0);
  return /^[a-z]$/.test(firstCharacter) ? category : category.slice(1); }

function categoryShortLabel(category) { return category.charAt(0); }

    function renderMenuCategories() {
const menu = document.getElementById("groupMenu"); menu.innerHTML = "";
const categories = [...new Set(sources.map(source => source.category))];
        categories.forEach(category => {
const button = document.createElement("button");
button.type = "button"; button.className = "groupOption";
button.classList.toggle("selected", category === currentMenuCategory);
button.tabIndex = category === currentMenuCategory ? menu.tabIndex : -1;
button.setAttribute("aria-label", categoryLabel(category));
const fullName = document.createElement("span");
fullName.className = "categoryFull"; fullName.textContent = categoryLabel(category);
const shortName = document.createElement("span");
shortName.className = "categoryShort"; shortName.textContent = categoryShortLabel(category);
button.appendChild(fullName); button.appendChild(shortName);
menu.appendChild(button);
        });
    }

// ==================================================
// MENU CATEGORY EVENTS
// ==================================================

    function groupEvents(e) {
const _self = e.target.closest(".groupOption") || e.target;
const selectedButton = () => document.querySelector("#groupMenu .groupOption.selected");

        if (e.type === "click") {
          if (_self._hasClass("groupOption") && _self != selectedButton()) {
currentMenuCategory = [...new Set(sources.map(source => source.category))][
  [..._self.parentElement.children].indexOf(_self) ]
renderMenuCategories(); renderSourceMenu(); updateSourceMenu();

( s => { if( s ) s.button.click() ; positionKeyboardSelection(s, true) }
  )( sources.find(source => source.category === currentMenuCategory && source.enabled) );
          }
selectedButton().focus();
        }
    }

groupMenu.addEventListener("click", groupEvents);

// ==================================================
// RENDER SOURCE MENU
// ==================================================

    function renderSourceMenu() {
const menu = document.getElementById("sourceMenu");
menu.innerHTML = "";
        sources.filter(source => source.category === currentMenuCategory).forEach(source => {
const wrapper = document.createElement("div");
wrapper.className = "source-entry";
const button = document.createElement("button");
button.type = "button"; button.className = "sourceOption"; button.tabIndex = -1;
        // Icon wrapper
const icon = document.createElement("span");
icon.className = "icon-content"; icon.innerHTML = source.icons || "";
button.appendChild(icon);
button.disabled = !source.enabled;
wrapper.appendChild(button); menu.appendChild(wrapper);
source.button = button; source.wrapper = wrapper;
        });
    }

// ==================================================
// SOURCE MENU EVENTS
// ==================================================

    function sourceMenuEvents(e) {
const _self = e.target.closest(".sourceOption") || e.target;
const source = _self._hasClass("sourceOption") ? sources.find(item => item.button === _self) : null;

        if (e.type === "click") {
    if (e.detail > 0 && ((h, b) => h > 0 && e.clientY >= b - h)(
sourceMenu.offsetHeight - sourceMenu.clientHeight, sourceMenu.getBoundingClientRect().bottom
    )) return;
e.preventDefault();
          if (!_self._hasClass("sourceOption")) {
const selectedButton = document.querySelector("#groupMenu .groupOption.selected");
if (selectedButton) selectedButton.focus();
    return;
          }
    if (source) selectSource(source.id, "mouse");

        } else if (e.type === "mouseover") {
if (source && !_self.contains(e.relatedTarget)) showSourceTooltip(_self, source.name);

        } else if (e.type === "mouseout") {
if (!_self.contains(e.relatedTarget)) hideSourceTooltip();
        } else if (e.type === "mousedown") {
if (source) e.preventDefault()
        }
    }

sourceMenu.addEventListener("click", sourceMenuEvents);
sourceMenu.addEventListener("mouseover", sourceMenuEvents);
sourceMenu.addEventListener("mouseout", sourceMenuEvents);
sourceMenu.addEventListener("mousedown", sourceMenuEvents);

// ==================================================
// SELECT SOURCE
// ==================================================

    function selectSource(sourceID) {
const source = sources.find(item => item.id === sourceID);
    if (!source) return;
    // Don't allow selection of disabled items, except the temporarily enabled error item.
    if (!source.enabled && sourceID !== temporaryErrorSource) return;
    // If moving away from the temporary error item, remove its temporary status.
if (temporaryErrorSource && sourceID !== temporaryErrorSource) temporaryErrorSource = null;
selectedSource = sourceID; updateSourceMenu(); loadRemoteSource(sourceID);
    }

// ==================================================
// UPDATE SOURCE MENU
// ==================================================

    function updateSourceMenu() {
        sources.forEach(source => {
    if (!source.button) return;
        // Temporarily enable the requested missing item.
source.button.disabled = !source.enabled && source.id !== temporaryErrorSource;
        // Normal green selection.
source.button.classList.toggle("selected", source.id === selectedSource && source.id !== temporaryErrorSource);
        // Red selection for a temporarily enabled item.
source.button.classList.toggle("selected-error", source.id === temporaryErrorSource && source.id === selectedSource);
        });
const sourceName = document.getElementById("sourceName");
        if (currentSource) {
sourceName.textContent = currentSource.name;
        } else if (selectedSource) {
const source = sources.find(item => item.id === selectedSource);
sourceName.textContent = source ? source.name : "";
        } else {
sourceName.textContent = "";
    }   }

// ==================================================
// KEYBOARD SELECTION POSITIONING
// ==================================================

    function positionKeyboardSelection(source, forceCentre = false) {
    if (!source || !source.wrapper) return;
const menu = document.getElementById("sourceMenu");
const menuRect = menu.getBoundingClientRect(); const itemRect = source.wrapper.getBoundingClientRect();
const menuWidth = menu.clientWidth;
let targetScroll;
        if (forceCentre) {
        // Initial selection: centre the item.

// ==================================================
// LOAD REMOTE SOURCE

    async function loadRemoteSource(sourceID) {

        try {

// ==================================================
// PROCESS SOURCE FILE

    function processFile(CubeFile) {

        if (dropdown.options.length > 0) {

// ==================================================
// LOAD SOURCE / INITIALISE
// ==================================================

    async function loadFile() {
const params = new URLSearchParams(window.location.search);
const urlSource = params.get("source");
const testMode = params.has("testmode");
const fileInput = document.getElementById("sourcefile");
const status = document.getElementById("status");
    // Test mode button
if (testMode) document.getElementById("testButton").style.display = "inline-block";
    // Local file selection is only available in test mode
fileInput.style.display = testMode ? "block" : "none";
    // Local file handling
        fileInput.addEventListener("change", async function() {
const file = fileInput.files[0];
    if (!file) return;
          try {
status.className = ""; status.textContent = "Reading " + file.name + "...";
currentSource = { id: "", name: file.name };
selectedSource = null; temporaryErrorSource = null;
updateSourceMenu();
const CubeFile = await file.text();
    if (selectedSource !== null) return;
processFile(CubeFile);
          } catch (error) {
status.className = "error"; status.textContent = "Error reading file: " + error.message;
console.error(error);
          }
        });
    // Load menu configuration
        try {
await loadSources();
        } catch (error) {
status.className = "error"; status.textContent = error.message; console.error(error);
        }
    // ==================================================
    // INITIAL SOURCE SELECTION
    // ==================================================
    // Prefer Main as the initial category.
    // Fall back to the first category if Main doesn't exist.
const categories = [...new Set(sources.map(source => source.category))];
currentMenuCategory = categories.includes("main") ? "main" : (categories[0] || "main");
const initialSources = sources.filter(source => source.category === currentMenuCategory);
let loadResult= null ;
    // URL source takes precedence.
        if (urlSource) {
const requestedSource = sources.find(item => item.id === urlSource);
        // Switch to the category containing the requested source.
if (requestedSource) { currentMenuCategory = requestedSource.category; renderMenuCategories(); renderSourceMenu(); }
        // Clear any previous temporary error selection.
temporaryErrorSource = null;
        // Requested source exists in the menu but is disabled.
            if (requestedSource && !requestedSource.enabled) {
            // Temporarily enable and select it.

            // Attempt to load it anyway.
            // The resulting error will be displayed normally.
loadResult= await loadRemoteSource(urlSource);
            } else {
            // Normal enabled menu item, or a source that doesn't appear in the menu.
selectedSource = requestedSource ? urlSource : null; updateSourceMenu();
if (selectedSource) positionKeyboardSelection(requestedSource, true);
loadResult= await loadRemoteSource(urlSource);
        }  }
        if( loadResult === false ) {
groupMenu.querySelector(".groupOption.selected")?.focus(); 
        }else if( loadResult === true ) {
          if (document.activeElement === document.body) {

        } } else {
    // ==================================================
    // NO URL SOURCE SPECIFIED
    // ==================================================

const firstEnabled = initialSources.find(source => source.enabled);
selectedSource = firstEnabled ? firstEnabled.id : null;
renderMenuCategories(); renderSourceMenu(); updateSourceMenu();
if (firstEnabled) positionKeyboardSelection(firstEnabled, true);
          if (testMode) {

fileInput.focus();
          } else if (!firstEnabled) {

groupMenu.querySelector(".groupOption.selected")?.focus();
          } else {

if (loadResult === false) { groupMenu.querySelector(".groupOption.selected")?.focus();
  } else if (loadResult === true) { if (document.activeElement === document.body) {
  document.getElementById( "draftButton" ).focus(); } }
    }   } }

// ==================================================
// PARSE CONTROL LINE
// ==================================================

    function parseControlLine(line) {
    // Unlimited block
const unlimitedMatch = line.match(/^`\s+\*\s+(\S+)(?:\s+(.*))?$/);
    if (unlimitedMatch) return {
unlimited: true, count: null, identifier: unlimitedMatch[1],
  parameters: (unlimitedMatch[2] || "").trim().split(/\s+/).filter(Boolean) };
    // Numbered block (existing notation)
const numberedMatch = line.match(/^`\s*(\d+)\s+(\S+)(?:\s+(.*))?$/);
    if (!numberedMatch) return null;
    return {
unlimited: false, count: parseInt(numberedMatch[1], 10), identifier: numberedMatch[2],
  parameters: (numberedMatch[3] || "").trim().split(/\s+/).filter(Boolean) };
    }

function isEndDelimiter(line) { return /^`\s*end\s*$/.test(line); }

// ==================================================
// FIND ALTERNATIVES AND VALIDATE IDENTIFIERS
// ==================================================

    function findAlternatives() {
alternatives = [];
    // ==================================================
    // COMPLETE FILE (NO CONTROL LINES)
    // ==================================================
        if (!sourceLines.some(line => line.startsWith("`"))) {
let description = "Full file (no name found)";
        // Look for the Settings block.
const settingsStart = sourceLines.findIndex(line => /^\s*\[Settings\]\s*$/i.test(line));
          if (settingsStart !== -1) {
          // Find the next section header.
let settingsEnd = sourceLines.findIndex((line, index) => index > settingsStart && /^\s*\[[^\]]+\]\s*$/.test(line));
if (settingsEnd === -1) settingsEnd = sourceLines.length;
          // Remove comment lines and extract JSON.
let settingsJSON = sourceLines.slice(settingsStart + 1, settingsEnd)
  .filter(line => !line.trimStart().startsWith("#")).join("\n");
          // Allow trailing commas before closing braces and brackets.
settingsJSON = settingsJSON.replace(/,\s*([}\]])/g, "$1");
            try {
const settings = JSON.parse(settingsJSON);
if (typeof settings.name === "string" && settings.name.trim() !== "") description = settings.name;
            } catch (error) {
console.warn("Unable to parse Settings JSON:", error);
          } }
          alternatives.push({
id: "fullfile", description: description, includes: [],
initLine: -1, descriptionLine: -1, count: null,
missing: [], errors: [], fullFile: true
          });
    return;
        }
    // ==================================================
    // NORMAL CONTROL-LINE PROCESSING
    // ==================================================
const knownIdentifiers = new Set();
        let i = 0; while (i < sourceLines.length) {
const line = sourceLines[i];
if (!line.startsWith("`")) { i++; continue; }
const control = parseControlLine(line);
        if (!control) { i++; continue; }
const { count, identifier, parameters, unlimited } = control;
knownIdentifiers.add(identifier);
          if (identifier === "init") {
const altID = parameters[0]; const includes = parameters.slice(1);
const descriptionLine = sourceLines[i + 1] || "";
const descriptionMatch = descriptionLine.match(/^\s*#\s*(.*?)\s*$/);
const description = descriptionMatch ? descriptionMatch[1] : "(Missing description)";
alternatives.push({ id: altID, description: description, includes: includes,
  initLine: i, descriptionLine: i + 1, count: count, missing: [], errors: [] });
          }

    // Find the end of the block
          if (unlimited) {
let end = i + 1;
while (end < sourceLines.length && sourceLines[end].trim() !== "` end") { end++; }
            if (end >= sourceLines.length) {
console.error("Missing closing delimiter for:", identifier);
        i++;
            } else {
        i = end + 1;
            }
          } else {
        i += count + 1;
          }
        }

    // Validate referenced identifiers
        for (const alt of alternatives) {
alt.missing = alt.includes.filter(id => !knownIdentifiers.has(id));
if (alt.count !== null && alt.count < 1) { alt.errors.push("init block must contain at least one line"); }
const descriptionLine = sourceLines[alt.descriptionLine] || "";
if (!/^\s*#\s*/.test(descriptionLine)) { alt.errors.push("Missing or invalid description comment"); }
    }   }

// ==================================================
// POPULATE DROPDOWN
// ==================================================

    function populateDropdown() {
const dropdown = document.getElementById("alternative");
dropdown.innerHTML = "";

        alternatives.forEach((alt, index) => {
const option = document.createElement("option");
option.value = index; option.textContent = alt.description;
dropdown.appendChild(option);
        });

dropdown.onchange = generateAlternative;
    }

// ==================================================
// GENERATE SELECTED ALTERNATIVE
// ==================================================

    function generateAlternative() {
const selectedIndex = document.getElementById("alternative").value;
const alt = alternatives[Number(selectedIndex)];

    if (!alt) return;

    // ==================================================
    // COMPLETE FILE
    // ==================================================
        if (alt.fullFile) {
        // Preserve the entire original file unchanged.
generatedText = sourceLines.join("\n"); generatedFilename = "dmc_fullfile.txt";
document.getElementById("output").textContent = generatedText;
document.getElementById("saveButton").disabled = false;
document.getElementById("draftButton").disabled = false;
document.getElementById("betaButton").disabled = false;
document.getElementById("testButton").disabled = false;

const status = document.getElementById("status");
status.className = ""; status.textContent = "Generated: " + alt.description;
    return;
        }
    // ==================================================
    // NORMAL ALTERNATIVE PROCESSING
    // ==================================================
const included = new Set(alt.includes); const output = [];
        let i = 0; while (i < sourceLines.length) {
const line = sourceLines[i];
        // Uncontrolled lines are included
          if (!line.startsWith("`")) {
output.push(line);
        i++; continue;
          }
const control = parseControlLine(line);
        if (!control) { i++; continue; }
const { count, identifier, unlimited } = control;
const isSelectedInit = identifier === "init" && i === alt.initLine;
const shouldInclude = included.has(identifier) || isSelectedInit;
            if (unlimited) {
            // Find closing delimiter
let end = i + 1; while (end < sourceLines.length && !isEndDelimiter(sourceLines[end])) { end++; }
if (shouldInclude) { for (let j = i + 1; j < end; j++) { output.push(sourceLines[j]); } }
            // Skip entire block, including delimiter
        i = end < sourceLines.length ? end + 1 : sourceLines.length;
            } else {
            // Existing numbered block
if (shouldInclude) { for (let j = 1; j <= count; j++) { if (i + j < sourceLines.length) {
  output.push(sourceLines[i + j]); } } }
        i += count + 1;
        }   }
generatedText = output.join("\n");
generatedFilename = "dmc_" + alt.id + ".txt";
document.getElementById("output").textContent = generatedText;
document.getElementById("saveButton").disabled = false;
document.getElementById("draftButton").disabled = false;
document.getElementById("betaButton").disabled = false;
document.getElementById("testButton").disabled = false;
const status = document.getElementById("status"); const problems = [];
if (alt.missing.length > 0) { problems.push("Missing identifiers: " + alt.missing.join(", ")); }
if (alt.errors.length > 0) { problems.push(...alt.errors); }
        if (problems.length > 0) {
status.className = "error"; 
status.textContent = "WARNING: " + alt.description + " - " + problems.join("; ");
        } else {
status.className = ""; status.textContent = "Generated: " + alt.description + " (" + alt.id + ")";
    }   }

// ==================================================
// SAVE GENERATED TEXT
// ==================================================

    function saveGeneratedText() {
    if (!generatedText) return;
const blob = new Blob([generatedText], { type: "text/plain;charset=utf-8" });
const url = URL.createObjectURL(blob);
const link = document.createElement("a");
link.href = url; link.download = generatedFilename;
document.body.appendChild(link);
link.click();
document.body.removeChild(link);
URL.revokeObjectURL(url);
    }

// ==================================================
// TEST MODE TEXT TRANSFORMATION
// ==================================================

    function generateTestText(text) {
const lines = text.split(/\r?\n/);
let inPredeterminedLayouts = false;
    return (
        lines.map(line => {
        // Replace all instances of ## with #
line = line.replace(/##/g, "#");

          if (line.includes('"predeterminedLayouts"')) {
inPredeterminedLayouts = true;
    return line;
          }
          if (inPredeterminedLayouts) {
          // Replace separators between items
line = line.replace(/","/g, '"],["');
          // End of predeterminedLayouts section
if (line.trim().endsWith("]]")) { inPredeterminedLayouts = false; }
          }
    return line;
        }).join("\n") );
    }

// ==================================================
// SEND TO DRAFTMANCER
// ==================================================
    async function sendToDraftmancer(draft, testMode = false) {
    if (!generatedText) { alert("No generated text available."); return; }
    if (typeof io !== "function") { alert("Socket.IO failed to load."); return; }
const Domain = draft === "beta" ? "https://beta.draftmancer.com" : "https://draftmancer.com";
    // Open tab immediately to avoid popup blocking
const draftWindow = window.open("about:blank", "_blank");
    if (!draftWindow) { alert("Please allow popups for this page."); return; }
draftWindow.document.title = "Connecting to Draftmancer...";
draftWindow.document.body.textContent = "Connecting to Draftmancer...\nPlease wait.";
    // Generate unique IDs
const sourceID = currentSource.id || "test"; const BotID = "bot_" + sourceID + Date.now(); const botName = sourceID + " bot";
const query = { userID: BotID, userName: botName, sessionSettings: "{}", sessionID: BotID };

let stage = "Connecting to Draftmancer"; let finished = false;
const status = document.getElementById("status");

        function showProgress(message) {
stage = message; status.className = ""; status.textContent = message;
if (!draftWindow.closed) { draftWindow.document.title = "Draftmancer";
  draftWindow.document.body.textContent = message + "\nPlease wait."; }
console.log(message);
        }

    // Connect
const socket = io(Domain, { query, transports: ["websocket"] });
    // Error handling
let connectionTimeout;
        function handleError(message) {
        if (finished) return;
        finished = true;
clearTimeout(connectionTimeout); socket.disconnect();
const errorMessage = "Draftmancer error:\n" + message;
status.className = "error"; status.textContent = errorMessage;
if (!draftWindow.closed) { draftWindow.document.title = "Draftmancer error";
  draftWindow.document.body.textContent = errorMessage + "\n\nYou can close this tab."; }
console.error(errorMessage);
        }

    // Timeout
connectionTimeout = setTimeout(() => { handleError("Timed out while: " + stage); }, 90000);
    // Socket connected
socket.on("connect", () => { showProgress("Socket connected. Waiting for session ownership..."); });
socket.on("connect_error", (error) => { handleError("Connection error: " + error.message); });
socket.on("disconnect", (reason) => { if (!finished) { handleError("Socket disconnected: " + reason); } });
    // Check session ownership
        socket.once("sessionOwner", (ownerID) => {
    if (finished) return;
          if (ownerID !== BotID) {
handleError("Not the session owner!\nExpected: " + BotID + "\nReceived: " + ownerID);
    return;
          }
showProgress("Session ownership confirmed. Sending configuration...");
console.log("Sending configuration, characters:", generatedText.length);

        // Send generated text to Draftmancer
const textToSend = testMode ? generateTestText(generatedText) : generatedText;
          socket.emit("parseCustomCardList", textToSend, (res) => {
    if (finished) return;
console.log("Draftmancer response:", res);

            if (!res || res.code < 0) {
handleError("Configuration rejected:\n" + JSON.stringify(res));
    return;
            }

          // Configuration accepted
showProgress("Configuration accepted. Opening Draftmancer...");

          // IMPORTANT:
          // Only now register the sessionUsers listener.
          // This follows the order in your original function.
socket.once("sessionUsers", () => { socket.disconnect(); });

          // Open Draftmancer
finished = true; clearTimeout(connectionTimeout);
draftWindow.location.href = Domain + "/?session=" + BotID;
console.log("Draftmancer session created:", BotID);
          }); // socket.emit(
        }); // socket.once(
    }

// ==================================================
// START
// ==================================================

let positioningDone = false;

    function runPositioning() {
    if (positioningDone) return;
    // Find the currently selected source.
const source = sources.find(item => item.id === selectedSource);
    if (!source || !source.wrapper) return;

    }

// Wait for images in the source menu.
    function waitForImages(container) {
const images = [...container.querySelectorAll("img")];
    return Promise.all(
        images.map(img => {
    if (img.complete) { return Promise.resolve(); }
    return (
          new Promise(resolve => {
            img.addEventListener("load", resolve, { once: true });
            img.addEventListener("error", resolve, { once: true });
          }) );
        }) );
    }

// Start loading the file and menu.
    loadFile().then(async () => {
const menuContainer = document.getElementById("sourceMenu");
    // Normal positioning mechanism.

    });

// Five-second safety fallback.
setTimeout(runPositioning, 5000);
